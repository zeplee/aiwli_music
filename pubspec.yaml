name: aiwli_music
description: "Aiwli Music — cross-platform music player (Flutter)."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---- 状态 / 路由 / 网络（设计文档 §1.1）----
  flutter_riverpod: ^2.6.0
  go_router: ^14.0.0
  dio: ^5.11.0

  # ---- 播放引擎（ADR-002：统一 media_kit）----
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

  # ---- 音频焦点 / 系统媒体（ADR-009 / ADR-014）----
  audio_session: ^0.2.4
  flutter_media_session: ^3.0.9
  audio_service_mpris: ^0.2.1

  # ---- 音源 JS 引擎（ADR-006）----
  flutter_js: 0.8.7

  # ---- 加密 / 压缩 / 编码 / 标签 ----
  pointycastle: ^3.9.0
  crypto: ^3.0.0
  archive: ^3.6.0
  fast_gbk: ^1.0.0
  audio_metadata_reader: ^1.8.1

  # ---- 曲库扫描（on_audio_query 活跃延续版，namespace/AGP9 兼容）----
  on_audio_query_pluse: ^3.0.7

  # ---- 下载落库（MediaStore，Android）----
  flutter_media_store: ^1.3.1

  # ---- WebDAV 同步（数据备份/恢复）----
  webdav_client: ^1.2.2

  # ---- 数据层（ADR-010）----
  drift: ^2.20.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.0

  # ---- 桌面外壳（M5）----
  flutter_secure_storage: ^11.2.0
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  desktop_multi_window: ^0.3.0

  # ---- 开放 API / 解析备用 ----
  shelf: ^1.4.0
  html: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/audio/
